# PPO RL Agent configuration (stable-baselines3)
# NOTE: n_timesteps=10000 is a smoke-test default.
# For research-quality training, increase to ≥500000 and run on GPU.

algorithm: PPO
n_timesteps: 10000
policy: MlpPolicy

ppo:
  learning_rate: 3.0e-4
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  verbose: 0         # set to 1 for training progress output

env:
  episode_length_steps: 288    # 24 hours at 5-min intervals
  dt_minutes: 5
  obs_history_steps: 12        # 1-hour glucose history in observation

reward:
  glucose_penalty_weight: 1.0
  hypo_penalty_weight: 10.0    # ×10 penalty for G < 70 mg/dL (TBR primary metric)
  hyper_penalty_weight: 0.5    # mild penalty for G > 180 mg/dL
  Gref_mgdL: 110.0

safety:
  hypo_threshold_mgdL: 80.0   # shield veto threshold
  shield_horizon_minutes: 30   # forward horizon for shield veto check
